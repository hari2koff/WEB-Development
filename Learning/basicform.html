<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>
    <meta charset="UTF-8" />
    <meta name="viewport" width="device-width" />
    <meta author="SDP" />
    <meta name="Description" content="just a basic form"/>
</head>

<body>

    <h1>Student Registration Form</h1>

    

        <fieldset>

            <legend>Student Details</legend>

            <!-- Name -->
            <label for="name">Name:</label>
            <input type="text" id="name"
                   placeholder="Enter your name">

            <br><br>

            <!-- Email -->
            <label for="email">Email:</label>
            <input type="email" id="email"
                   placeholder="Enter your email">

            <br><br>

            <!-- Password -->
            <label for="password">Password:</label>
            <input type="password" id="password"
                   placeholder="Enter your password">

            <br><br>

            <!-- Phone -->
            <label for="phone">Phone:</label>
            <input type="tel" id="phone"
                   placeholder="Enter phone number">

            <br><br>

            <!-- Gender -->
            <label>Gender:</label>

            <input type="radio" name="gender" value="male">
            <label>Male</label>

            <input type="radio" name="gender" value="female">
            <label>Female</label>

            <br><br>

            <!-- Department -->
            <label for="department">Department:</label>

            <select id="department">

                <optgroup label="Computer Departments">
                    <option>CSE</option>
                    <option>AIML</option>
                    <option>IT</option>
                </optgroup>

                <optgroup label="Core Departments">
                    <option>ECE</option>
                    <option>EEE</option>
                    <option>Mechanical</option>
                </optgroup>

            </select>

            <br><br>

            <!-- Address -->
            <label for="address">Address:</label>
            <br>

            <textarea id="address"
                      rows="5"
                      cols="40"
                      placeholder="Enter your address">
            </textarea>

            <br><br>

            <!-- Skills -->
            <label>Skills:</label>

            <input type="checkbox" id="c">
            <label for="c">C</label>

            <input type="checkbox" id="java">
            <label for="java">Java</label>

            <input type="checkbox" id="JavaScript">
            <label for="python">Python</label>

            <br><br>

            <!-- Buttons -->
            <a href="https://github.com/hari2koff/WEB-Development" target="_blank"> <button type="submit">Register</button> </a>

            <button type="reset">Clear</button>

        </fieldset>

    

</body>

</html>
